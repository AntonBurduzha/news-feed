user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    log_format json escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time",'
        '"correlation_id":"$correlation_id"}';
    access_log /var/log/nginx/access.log json;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65s;
    server_tokens      off;

    client_max_body_size   2m;
    client_body_timeout    15s;
    client_header_timeout  15s;

    gzip              on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        application/json application/javascript text/plain text/css;

    limit_req_zone  $binary_remote_addr  zone=api:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr  zone=login:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr  zone=conns:10m;
    limit_req_status  429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
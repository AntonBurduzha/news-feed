# Grafana UI: http://localhost:3003  (anonymous admin, no login needed)
# Alloy UI: http://localhost:12345 (verify scrape targets and pipeline health)
# Loki API: http://localhost:3100
# Mimir API: http://localhost:9009
# Tempo API: http://localhost:3200

services:
  loki:
    image: grafana/loki:3.0.0
    ports:
      - '3100:3100' # Loki HTTP API
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml # Loki config
      - loki_data:/loki # persistent log storage
    command: -config.file=/etc/loki/local-config.yaml

  mimir:
    image: grafana/mimir:2.12.0
    ports:
      - '9009:9009' # Mimir HTTP API: /prometheus for queries, /api/v1/push for writes
    volumes:
      - ./infra/mimir/mimir-config.yaml:/etc/mimir.yaml
      - mimir_data:/data # persistent metrics storage
    command: -config.file=/etc/mimir.yaml

  tempo:
    image: grafana/tempo:2.4.0
    ports:
      - '3200:3200'
      - '4317:4317'
      - '4318:4318'
    volumes:
      - ./infra/tempo/tempo-config.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    command: -config.file=/etc/tempo.yaml

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - '3003:3000' # host 3003 to avoid colision with monolith on 3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true' # skip login screen for dev
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin # admin access on dev
    volumes:
      - ./infra/grafana/provisioning/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./infra/grafana/provisioning/providers/dashboards.yaml:/etc/grafana/provisioning/dashboards/news-feed.yaml
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana # persists settings and alert state across restarts
    depends_on:
      - loki
      - mimir
      - tempo

  alloy:
    image: grafana/alloy:v1.19.2
    # The docker socket is owned by root:docker; without this Alloy gets EACCES.
    user: root
    ports:
      - '12345:12345'
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run /etc/alloy/config.alloy --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - loki
      - mimir
      - tempo

volumes:
  loki_data: # Loki log data
  grafana_data: # Grafana dashboards, settings, alert state
  mimir_data: # Mimir metrics TSDB blocks
  tempo_data: # Tempo trace blocks
